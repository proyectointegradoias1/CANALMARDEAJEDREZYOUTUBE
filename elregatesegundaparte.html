<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuestionario: El Regate en Finales de Peones (2ª Parte)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: #f4f7f6;
            color: #333;
        }
        .quiz-container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
            font-style: italic;
        }
        .question {
            margin-bottom: 25px;
            padding: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background-color: #fafafa;
        }
        .question p {
            font-weight: bold;
            font-size: 1.1em;
            margin-top: 0;
            color: #2c3e50;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option {
            padding: 12px 15px;
            border: 2px solid #dcdde1;
            border-radius: 6px;
            cursor: pointer;
            background-color: #ffffff;
            transition: all 0.2s ease;
            font-size: 1em;
        }
        .option:hover {
            background-color: #f1f2f6;
            border-color: #7f8fa6;
        }
        /* Corrección al pinchar */
        .option.correct {
            background-color: #4cd137 !important; /* Verde */
            color: white;
            border-color: #44bd32 !important;
        }
        .option.incorrect {
            background-color: #ff9f43 !important; /* Naranja */
            color: white;
            border-color: #ee5253 !important;
        }
        /* Desactivar opciones contestadas */
        .option.disabled {
            pointer-events: none;
        }
        #submit-btn {
            display: block;
            width: 100%;
            padding: 15px;
            font-size: 1.1em;
            font-weight: bold;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 30px;
            transition: background-color 0.3s;
        }
        #submit-btn:hover {
            background-color: #2980b9;
        }
        #result {
            margin-top: 25px;
            padding: 20px;
            font-size: 1.2em;
            text-align: center;
            border-radius: 6px;
            display: none;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <h1>Cuestionario: El Regate en Finales de Peones (2ª Parte)</h1>
    <p class="subtitle">Lección de finales de ajedrez del canal MARdeAJEDREZ</p>

    <div id="quiz"></div>

    <button id="submit-btn" onclick="showResults()">Ver Puntuación Final</button>
    <div id="result"></div>
</div>

<script>
    // Base de datos de 12 preguntas con distribución exacta del 25% por opción (3 A, 3 B, 3 C, 3 D)
    const quizData = [
        {
            question: "1. ¿En qué consiste fundamentalmente el recurso táctico del 'regate' en los finales de peones complejos?",
            options: [
                { text: "En una secuencia calculada de sacrificios y rupturas entre peones enfrentados para despejar el camino del peón candidato hacia la coronación.", isCorrect: true }, // Opción A
                { text: "En una maniobra de rey para ganar la oposición a gran distancia.", isCorrect: false },
                { text: "En avanzar todos los peones alineados sin permitir ninguna captura.", isCorrect: false },
                { text: "En forzar el ahogado del rey propio para asegurar las tablas.", isCorrect: false }
            ]
        },
        {
            question: "2. En las posiciones complejas de regate con 4 o 5 peones por bando, ¿cómo se define el 'peón candidato' según el criterio clásico de Capablanca?",
            options: [
                { text: "El peón que se encuentra más cerca del rey defensor.", isCorrect: false },
                { text: "Aquel peón que tiene menos peones enemigos en su columna y columnas adyacentes para obstaculizar su avance hacia la coronación.", isCorrect: true }, // Opción B
                { text: "El peón que avanza dando jaque directo al rey rival.", isCorrect: false },
                { text: "El peón central que se mantiene inmóvil defendiendo la cadena.", isCorrect: false }
            ]
        },
        {
            question: "3. Cuando el bando defensor detecta que el rival intenta iniciar una secuencia de regate en el centro, ¿cuál es la mejor maniobra defensiva para neutralizar la ruptura?",
            options: [
                { text: "Retirar el rey a la primera fila inmediatamente.", isCorrect: false },
                { text: "Entregar todos los peones de los flancos.", isCorrect: false },
                { text: "Avanzar el peón central para bloquear el avance del peón atacante e impedir que se abra paso la secuencia de sacrificios.", isCorrect: true }, // Opción C
                { text: "Mover el rey en diagonal en busca de casillas conjugadas.", isCorrect: false }
            ]
        },
        {
            question: "4. En un final de regate masivo donde ambos bandos logran crear un peón pasado, ¿qué factor profiláctico resulta determinante antes de coronar a ciegas?",
            options: [
                { text: "Verificar que el rey contrario no esté ahogado en la esquina.", isCorrect: false },
                { text: "Ofrecer tablas antes de mover el peón pasado.", isCorrect: false },
                { text: "Intercambiar las torres del tablero antes de avanzar.", isCorrect: false },
                { text: "Comprobar mediante la regla del cuadrado si nuestro rey puede detener el peón pasado enemigo o si nuestra dama coronará con jaque ganando un tiempo vital.", isCorrect: true } // Opción D
            ]
        },
        {
            question: "5. En las estructuras de regate de 4 contra 4 o 5 contra 5 peones, ¿por qué suelen existir múltiples caminos o formas de victoria?",
            options: [
                { text: "Porque la entrega de peones en un flanco crea desviaciones defensivas que habilitan la coronación en el flanco opuesto o en el centro.", isCorrect: true }, // Opción A
                { text: "Porque los peones avanzados valen el doble de puntos tácticos.", isCorrect: false },
                { text: "Porque el rey defensor queda automáticamente inmovilizado en la casilla a1.", isCorrect: false },
                { text: "Porque las reglas del ajedrez impiden al bando defensor capturar más de dos peones.", isCorrect: false }
            ]
        },
        {
            question: "6. ¿Qué ocurre si durante un regate el bando atacante se precipita y avanza un peón sin despejar previamente a los peones defensores enemigos?",
            options: [
                { text: "El peón se convierte automáticamente en dama en la sexta fila.", isCorrect: false },
                { text: "La secuencia se interrumpe, el bando defensor bloquea el paso y puede tomar la oposición con su rey para entablar o ganar.", isCorrect: true }, // Opción B
                { text: "Se produce un ahogado inmediato por falta de movimientos legales.", isCorrect: false },
                { text: "El rey atacante pierde el derecho a entrar en el cuadrado del peón rival.", isCorrect: false }
            ]
        },
        {
            question: "7. En finales de peones con regate de gran complejidad, ¿qué papel juega la regla del cuadrado trazada por el rey atacante?",
            options: [
                { text: "Ninguno, ya que el rey nunca debe intervenir en los finales de peones.", isCorrect: false },
                { text: "Sirve únicamente para calcular el mate de rey y torre.", isCorrect: false },
                { text: "Permite al rey atacante mantenerse dentro del radio del peón libre enemigo mientras sus propios peones realizan el regate de coronación.", isCorrect: true }, // Opción C
                { text: "Garantiza que el rey rival se mueva exclusivamente en casillas de su mismo color.", isCorrect: false }
            ]
        },
        {
            question: "8. Cuando un regate deriva en una carrera de coronación simultánea en ambos flancos, ¿qué ventaja táctica permite a uno de los bandos ganar aunque ambos coronen en la misma jugada?",
            options: [
                { text: "Coronar un peón de la columna h en lugar de a.", isCorrect: false },
                { text: "Tener el rey en una casilla central sin piezas.", isCorrect: false },
                { text: "Que el peón promueva en la casilla e8 sin oposición.", isCorrect: false },
                { text: "Que la nueva dama entre en juego dando jaque al rey enemigo o controlando directamente la casilla de coronación del rival.", isCorrect: true } // Opción D
            ]
        },
        {
            question: "9. ¿Cuál es la diferencia fundamental entre el tema del 'cuadrado errante' y el tema del 'regate'?",
            options: [
                { text: "El cuadrado errante se basa en la defensa mutua a distancia entre dos peones aislados, mientras que el regate es una secuencia activa de sacrificios y rupturas para abrir paso a un peón candidato.", isCorrect: true }, // Opción A
                { text: "El regate solo se produce con peones de torre y el cuadrado errante con peones centrales.", isCorrect: false },
                { text: "El cuadrado errante requiere la ayuda del rey y el regate se juega sin reyes.", isCorrect: false },
                { text: "No existe ninguna diferencia, son dos nombres exactos para la misma posición de tablas.", isCorrect: false }
            ]
        },
        {
            question: "10. En las posiciones de regate donde el rey defensor intenta frenar a los peones en masa, ¿qué efecto produce el agotamiento de las jugadas de peón del bando defensor?",
            options: [
                { text: "Un empate automático por la regla de los 50 movimientos.", isCorrect: false },
                { text: "Un zugzwang que obliga al rey defensor a apartarse, cediendo el paso definitivo al peón de coronación.", isCorrect: true }, // Opción B
                { text: "La pérdida inmediata de la dama recién coronada.", isCorrect: false },
                { text: "El reinicio de la posición de origen.", isCorrect: false }
            ]
        },
        {
            question: "11. Cuando se realiza un sacrificio de ruptura en el regate (por ejemplo, d5 en una cadena c4-d4-e4), ¿cuál es el objetivo principal de esa entrega?",
            options: [
                { text: "Dar jaque al rey enemigo para desplazarlo a la banda.", isCorrect: false },
                { text: "Forzar al rival a enrocarse en el final.", isCorrect: false },
                { text: "Desviar a uno de los peones defensores para dejar libre la columna adyacente por la que correrá el peón candidato.", isCorrect: true }, // Opción C
                { text: "Bloquear el paso del rey propio hacia la octava fila.", isCorrect: false }
            ]
        },
        {
            question: "12. ¿Qué recomendación de cálculo es imprescindible aplicar antes de lanzar un regate completo en una partida de competición?",
            options: [
                { text: "Mover los peones lo más rápido posible sin detenerse a contar.", isCorrect: false },
                { text: "Calcular únicamente las dos primeras jugadas y confiar en la suerte.", isCorrect: false },
                { text: "Asumir que todos los sacrificios de peones llevan al jaque mate directo.", isCorrect: false },
                { text: "Verificar de principio a fin la variante concreta (carrera de peones, tiempos de coronación y control de casillas clave) para evitar sorpresas o jaques del rival al coronar.", isCorrect: true } // Opción D
            ]
        }
    ];

    let score = 0;
    let answeredQuestions = 0;

    // Función para construir el cuestionario
    function buildQuiz() {
        const quizContainer = document.getElementById('quiz');
        quizData.forEach((q, qIndex) => {
            const questionDiv = document.createElement('div');
            questionDiv.classList.add('question');
            questionDiv.innerHTML = `<p>${q.question}</p>`;
            
            const optionsDiv = document.createElement('div');
            optionsDiv.classList.add('options');
            
            q.options.forEach((opt, oIndex) => {
                const optionDiv = document.createElement('div');
                optionDiv.classList.add('option');
                optionDiv.innerText = opt.text;
                optionDiv.onclick = () => selectOption(optionDiv, opt.isCorrect, qIndex);
                optionsDiv.appendChild(optionDiv);
            });
            
            questionDiv.appendChild(optionsDiv);
            quizContainer.appendChild(questionDiv);
        });
    }

    // Selección de opción y corrección
    function selectOption(selectedDiv, isCorrect, qIndex) {
        const optionsDiv = selectedDiv.parentElement;
        const allOptions = optionsDiv.querySelectorAll('.option');
        
        if (optionsDiv.classList.contains('answered')) return;
        
        optionsDiv.classList.add('answered');
        answeredQuestions++;

        allOptions.forEach(opt => opt.classList.add('disabled'));

        if (isCorrect) {
            selectedDiv.classList.add('correct'); // Verde
            score++;
        } else {
            selectedDiv.classList.add('incorrect'); // Naranja
            // Mostrar la opción correcta en verde
            quizData[qIndex].options.forEach((opt, idx) => {
                if(opt.isCorrect) {
                    allOptions[idx].classList.add('correct');
                }
            });
        }
    }

    // Calcular y mostrar resultados con los mensajes por tramos
    function showResults() {
        if (answeredQuestions < quizData.length) {
            alert('Por favor, responde todas las preguntas pinchando en una opción antes de ver la puntuación final.');
            return;
        }

        const resultDiv = document.getElementById('result');
        resultDiv.style.display = 'block';
        
        let message = '';
        
        if (score < 6) {
            message = 'Necesitas mejorar. Lo ideal sería volver a ver el vídeo con tranquilidad e intentarlo de nuevo.';
            resultDiv.style.backgroundColor = '#f8d7da';
            resultDiv.style.color = '#721c24';
        } else if (score >= 6 && score <= 7) {
            message = '¡Bien! Has captado las ideas básicas, aunque te convendría repasar para afianzar conceptos.';
            resultDiv.style.backgroundColor = '#fff3cd';
            resultDiv.style.color = '#856404';
        } else if (score >= 8 && score <= 11) {
            message = '¡Bastante bien! Tienes un buen dominio de los conceptos tácticos del regate.';
            resultDiv.style.backgroundColor = '#cce5ff';
            resultDiv.style.color = '#004085';
        } else if (score === 12) {
            message = '¡Estupendo! Has estado pendiente del vídeo y has respondido todas las preguntas correctamente.';
            resultDiv.style.backgroundColor = '#d4edda';
            resultDiv.style.color = '#155724';
        }

        resultDiv.innerHTML = `<strong>Puntuación conseguida: ${score} de 12</strong><br><br>${message}`;
        document.getElementById('submit-btn').style.display = 'none';
    }

    // Inicialización al cargar la página
    buildQuiz();
</script>
</body>
</html>
