<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuestionario: Casillas Críticas y Límites en Ajedrez</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: #f4f7f6;
            color: #333;
        }
        .quiz-container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
            font-style: italic;
        }
        .question {
            margin-bottom: 25px;
            padding: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background-color: #fafafa;
        }
        .question p {
            font-weight: bold;
            font-size: 1.1em;
            margin-top: 0;
            color: #2c3e50;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option {
            padding: 12px 15px;
            border: 2px solid #dcdde1;
            border-radius: 6px;
            cursor: pointer;
            background-color: #ffffff;
            transition: all 0.2s ease;
            font-size: 1em;
        }
        .option:hover {
            background-color: #f1f2f6;
            border-color: #7f8fa6;
        }
        /* Clases para la corrección al pinchar */
        .option.correct {
            background-color: #4cd137 !important; /* Verde */
            color: white;
            border-color: #44bd32 !important;
        }
        .option.incorrect {
            background-color: #ff9f43 !important; /* Naranja */
            color: white;
            border-color: #ee5253 !important;
        }
        /* Desactivar opciones una vez contestadas */
        .option.disabled {
            pointer-events: none;
        }
        #submit-btn {
            display: block;
            width: 100%;
            padding: 15px;
            font-size: 1.1em;
            font-weight: bold;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 30px;
            transition: background-color 0.3s;
        }
        #submit-btn:hover {
            background-color: #2980b9;
        }
        #result {
            margin-top: 25px;
            padding: 20px;
            font-size: 1.2em;
            text-align: center;
            border-radius: 6px;
            display: none;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <h1>Cuestionario: Casillas Críticas y Límites</h1>
    <p class="subtitle">Basado en el lección de finales de peones de MARdeAJEDREZ</p>

    <div id="quiz"></div>

    <button id="submit-btn" onclick="showResults()">Ver Puntuación Final</button>
    <div id="result"></div>
</div>

<script>
    // Base de datos de preguntas extraídas exactamente del vídeo
    const quizData = [
        {
            question: "1. ¿En qué consisten las 'casillas críticas' (también llamadas eficazes o claves) en los finales de peones?",
            options: [
                { text: "Son casillas en la primera fila donde el rey rival no puede dar jaque.", isCorrect: false },
                { text: "Son aquellas casillas que, si nuestro rey consigue ocuparlas, garantizan la coronación del peón.", isCorrect: true },
                { text: "Son las casillas de las esquinas del tablero donde el rey queda ahogado.", isCorrect: false },
                { text: "Son las casillas ocupadas por las torres enemigas.", isCorrect: false }
            ]
        },
        {
            question: "2. Cuando un peón se halla en la cuarta fila (sin haber superado la mitad del tablero), ¿dónde se sitúan sus casillas críticas?",
            options: [
                { text: "Tres casillas situadas dos filas por delante del peón.", isCorrect: true },
                { text: "Una fila por detrás del peón propio.", isCorrect: false },
                { text: "En la misma fila horizontal del peón.", isCorrect: false },
                { text: "Tres casillas inmediatamente a la izquierda del peón.", isCorrect: false }
            ]
        },
        {
            question: "3. En el ejemplo del peón en g3, ¿por qué no debemos apresurarnos a saltar directamente a las casillas críticas?",
            options: [
                { text: "Porque el peón avanzaría con jaque y se ahogaría la partida.", isCorrect: false },
                { text: "Porque las negras harían uso de la oposición para cerrarnos el paso y evitar que pisemos ninguna de ellas.", isCorrect: true },
                { text: "Porque el rey negro capturaría el peón de g3 inmediatamente.", isCorrect: false },
                { text: "Porque se perdería el derecho a realizar la jugada de espera.", isCorrect: false }
            ]
        },
        {
            question: "4. Cuando el peón ha rebasado la mitad del tablero y se encuentra en la quinta fila, ¿cuáles son las casillas críticas?",
            options: [
                { text: "Tres filas por delante del peón.", isCorrect: false },
                { text: "Cualquiera de las tres casillas situadas justo delante del peón (una fila por delante).", isCorrect: true },
                { text: "Las casillas de la columna adyacente en la primera fila.", isCorrect: false },
                { text: "Únicamente la casilla de la esquina opuesta.", isCorrect: false }
            ]
        },
        {
            question: "5. ¿Qué son las 'casillas límites' explicadas en el vídeo?",
            options: [
                { text: "Las tres casillas a la izquierda o las tres a la derecha de un peón enemigo que, al ser ocupadas por nuestro rey, permiten ganar.", isCorrect: true },
                { text: "Las casillas del borde del tablero por donde no se puede pasar.", isCorrect: false },
                { text: "Las casillas de promoción de los peones de torre.", isCorrect: false },
                { text: "Las casillas a las que solo puede acceder la dama.", isCorrect: false }
            ]
        },
        {
            question: "6. En el ejemplo con el peón enemigo en d6, ¿por qué la propia casilla d6 funciona también como una casilla crítica?",
            options: [
                { text: "Porque al tener nuestro peón en quinta fila, capturar en d6 sitúa a nuestro rey en la casilla justo delante necesaria para ganar.", isCorrect: true },
                { text: "Porque da jaque doble al rey y a la torre rival.", isCorrect: false },
                { text: "Porque al capturar en d6 el peón enemigo se convierte en propio.", isCorrect: false },
                { text: "Porque impide que el rey negro avance a la octava fila.", isCorrect: false }
            ]
        },
        {
            question: "7. ¿Qué maniobra intermedia realiza el rey blanco (por ejemplo, jugando Rey g5) antes de entrar a las casillas límites?",
            options: [
                { text: "Entregar el peón para buscar tablas por ahogado.", isCorrect: false },
                { text: "Aproximarse con sutileza para tomar la oposición al rey rival y forzar el acceso a las casillas clave.", isCorrect: true },
                { text: "Retroceder a la primera fila para esperar un error del negro.", isCorrect: false },
                { text: "Avanzar el peón a la sexta fila perdiendo un tiempo.", isCorrect: false }
            ]
        },
        {
            question: "8. En el último ejemplo del vídeo, ¿a qué famoso compositor y teórico ruso de finales de peones se hace referencia?",
            options: [
                { text: "Garry Kasparov.", isCorrect: false },
                { text: "Nikolai Grigoriev.", isCorrect: true },
                { text: "Alexander Alekhine.", isCorrect: false },
                { text: "Mikhail Tal.", isCorrect: false }
            ]
        },
        {
            question: "9. ¿Qué tipo de oposición intermedia se utiliza en el estudio final para aproximarse al peón enemigo antes de transformarse en oposición frontal?",
            options: [
                { text: "Oposición colateral.", isCorrect: false },
                { text: "Oposición diagonal (o virtual).", isCorrect: true },
                { text: "Oposición por la espalda.", isCorrect: false },
                { text: "Oposición asimétrica de torre.", isCorrect: false }
            ]
        },
        {
            question: "10. ¿Cuál es el resultado garantizado una vez que nuestro rey logra ocupar una casilla crítica en un final de peones bien conducido?",
            options: [
                { text: "Forzar tablas por repetición de jugadas.", isCorrect: false },
                { text: "La coronación inevitable del peón y la victoria de la partida.", isCorrect: true },
                { text: "El ahogado del rey defensor.", isCorrect: false },
                { text: "El cambio forzado de reyes.", isCorrect: false }
            ]
        }
    ];

    let score = 0;
    let answeredQuestions = 0;

    // Función para construir el cuestionario dinámicamente
    function buildQuiz() {
        const quizContainer = document.getElementById('quiz');
        quizData.forEach((q, qIndex) => {
            const questionDiv = document.createElement('div');
            questionDiv.classList.add('question');
            questionDiv.innerHTML = `<p>${q.question}</p>`;
            
            const optionsDiv = document.createElement('div');
            optionsDiv.classList.add('options');
            
            q.options.forEach((opt, oIndex) => {
                const optionDiv = document.createElement('div');
                optionDiv.classList.add('option');
                optionDiv.innerText = opt.text;
                // Al hacer clic, se llama a la función de selección
                optionDiv.onclick = () => selectOption(optionDiv, opt.isCorrect, qIndex);
                optionsDiv.appendChild(optionDiv);
            });
            
            questionDiv.appendChild(optionsDiv);
            quizContainer.appendChild(questionDiv);
        });
    }

    // Función que evalúa la opción pinchada
    function selectOption(selectedDiv, isCorrect, qIndex) {
        const optionsDiv = selectedDiv.parentElement;
        const allOptions = optionsDiv.querySelectorAll('.option');
        
        // Evitar que se responda más de una vez a la misma pregunta
        if (optionsDiv.classList.contains('answered')) return;
        
        optionsDiv.classList.add('answered');
        answeredQuestions++;

        // Desactivar todas las opciones de esta pregunta
        allOptions.forEach(opt => opt.classList.add('disabled'));

        if (isCorrect) {
            selectedDiv.classList.add('correct');
            score++;
        } else {
            selectedDiv.classList.add('incorrect');
            // Si falla, mostramos automáticamente cuál era la correcta en verde
            quizData[qIndex].options.forEach((opt, idx) => {
                if(opt.isCorrect) {
                    allOptions[idx].classList.add('correct');
                }
            });
        }
    }

    // Función para calcular y mostrar el resultado final
    function showResults() {
        if (answeredQuestions < quizData.length) {
            alert('Por favor, responde todas las preguntas pinchando en una opción antes de ver la puntuación final.');
            return;
        }

        const resultDiv = document.getElementById('result');
        resultDiv.style.display = 'block';
        
        let message = '';
        
        // Lógica de mensajes según puntuación
        if (score === 10) {
            message = '¡Nivel máximo! Dominas a la perfección las casillas críticas y límites.';
            resultDiv.style.backgroundColor = '#d4edda';
            resultDiv.style.color = '#155724';
        } else if (score >= 7) {
            message = '¡Estupendo! Has asimilado muy bien los conceptos clave para ganar finales de peones.';
            resultDiv.style.backgroundColor = '#cce5ff';
            resultDiv.style.color = '#004085';
        } else if (score >= 5) {
            message = '¡Está bien! Te vendría bien repasar la lección para no confundir las casillas críticas con la posición de la oposición.';
            resultDiv.style.backgroundColor = '#fff3cd';
            resultDiv.style.color = '#856404';
        } else {
            message = 'Debes mejorar. Te recomiendo volver a ver el vídeo con calma para entender cómo acceder a las casillas clave.';
            resultDiv.style.backgroundColor = '#f8d7da';
            resultDiv.style.color = '#721c24';
        }

        resultDiv.innerHTML = `<strong>Puntuación conseguida: ${score} de 10</strong><br><br>${message}`;
        document.getElementById('submit-btn').style.display = 'none'; // Oculta el botón tras finalizar
    }

    // Inicializamos el cuestionario al cargar
    buildQuiz();
</script>
</body>
</html>
