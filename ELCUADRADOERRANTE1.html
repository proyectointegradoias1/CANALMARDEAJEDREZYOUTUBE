<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuestionario: El Cuadrado Errante en Ajedrez</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            background-color: #f4f7f6;
            color: #333;
        }
        .quiz-container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
            font-style: italic;
        }
        .question {
            margin-bottom: 25px;
            padding: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background-color: #fafafa;
        }
        .question p {
            font-weight: bold;
            font-size: 1.1em;
            margin-top: 0;
            color: #2c3e50;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option {
            padding: 12px 15px;
            border: 2px solid #dcdde1;
            border-radius: 6px;
            cursor: pointer;
            background-color: #ffffff;
            transition: all 0.2s ease;
            font-size: 1em;
        }
        .option:hover {
            background-color: #f1f2f6;
            border-color: #7f8fa6;
        }
        /* Corrección al pinchar */
        .option.correct {
            background-color: #4cd137 !important; /* Verde */
            color: white;
            border-color: #44bd32 !important;
        }
        .option.incorrect {
            background-color: #ff9f43 !important; /* Naranja */
            color: white;
            border-color: #ee5253 !important;
        }
        /* Desactivar opciones contestadas */
        .option.disabled {
            pointer-events: none;
        }
        #submit-btn {
            display: block;
            width: 100%;
            padding: 15px;
            font-size: 1.1em;
            font-weight: bold;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 30px;
            transition: background-color 0.3s;
        }
        #submit-btn:hover {
            background-color: #2980b9;
        }
        #result {
            margin-top: 25px;
            padding: 20px;
            font-size: 1.2em;
            text-align: center;
            border-radius: 6px;
            display: none;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <h1>Cuestionario: El Cuadrado Errante</h1>
    <p class="subtitle">Lección de finales de peones del canal MARdeAJEDREZ</p>

    <div id="quiz"></div>

    <button id="submit-btn" onclick="showResults()">Ver Puntuación Final</button>
    <div id="result"></div>
</div>

<script>
    // Base de datos de 10 preguntas
    const quizData = [
        {
            question: "1. ¿En qué consiste la estructura conocida como 'cuadrado errante' (también llamado común o móvil)?",
            options: [
                { text: "En cuatro peones unidos en forma de bloque en el centro del tablero.", isCorrect: false },
                { text: "En un par de peones aislados que se defienden indirectamente avanzando, pues si el rey enemigo captura uno, el otro se cuela y corona.", isCorrect: true },
                { text: "En una red de mate formada por un peón y dos torres.", isCorrect: false },
                { text: "En cuatro peones situados en las esquinas del tablero.", isCorrect: false }
            ]
        },
        {
            question: "2. En el primer ejemplo mostrado (de Jan Batiste Ger / Lolli), ¿por qué el avance a4 defiende indirectamente al peón de c3?",
            options: [
                { text: "Porque si las negras capturan en c3, el peón de a4 tiene camino libre para coronar.", isCorrect: true },
                { text: "Porque el peón de a4 está protegido por la torre de a1.", isCorrect: false },
                { text: "Porque da jaque al rey negro en la siguiente jugada.", isCorrect: false },
                { text: "Porque obliga al rey negro a quedar ahogado.", isCorrect: false }
            ]
        },
        {
            question: "3. ¿Qué regla técnica establece que si el cuadrado trazado entre dos peones aislados llega hasta la fila de coronación, los peones ganan sin ayuda del rey?",
            options: [
                { text: "La regla de Lucena.", isCorrect: false },
                { text: "La regla de Studineski (o Studeneski).", isCorrect: true },
                { text: "El principio de Philidor.", isCorrect: false },
                { text: "La regla de las casillas conjugadas.", isCorrect: false }
            ]
        },
        {
            question: "4. ¿Qué célebre frase atribuye el vídeo al campeón mundial Tigran Petrosian sobre los libros y el aprendizaje?",
            options: [
                { text: "'El ajedrez es un 99% de táctica pura y cálculo.'", isCorrect: false },
                { text: "'Usted confíe en los libros y en sus profesores, pero usted compruebe.'", isCorrect: true },
                { text: "'Los finales de peones son los más sencillos del juego.'", isCorrect: false },
                { text: "'Un peón pasado es un peligro que debe ser destruido.'", isCorrect: false }
            ]
        },
        {
            question: "5. En el estudio compuesto por el propio autor del canal, ¿por qué los peones ganan de forma autónoma?",
            options: [
                { text: "Porque el rey blanco está en posición de ahogado y no puede ayudar, pero se cumple la regla de Studineski.", isCorrect: true },
                { text: "Porque el rey negro abandonó antes de jugar.", isCorrect: false },
                { text: "Porque ambos peones están unidos en la misma columna.", isCorrect: false },
                { text: "Porque el rey negro no tiene movimientos legales.", isCorrect: false }
            ]
        },
        {
            question: "6. En la partida entre José Raúl Capablanca y Conde, ¿qué sorprendente jugada realiza Capablanca para iniciar su plan?",
            options: [
                { text: "Entrega su torre en la octava fila.", isCorrect: false },
                { text: "Juega b4, entregando un peón para crear un peón pasado y tejer el cuadrado errante.", isCorrect: true },
                { text: "Avance directo h5 sin mirar el flanco opuesto.", isCorrect: false },
                { text: "Refugia a su rey detrás de sus peones.", isCorrect: false }
            ]
        },
        {
            question: "7. ¿Por qué en la partida de Capablanca era un error precipitarse con h5 antes de capturar el peón rival?",
            options: [
                { text: "Porque el peón b negro corría y las negras podían coronar con jaque o crear su propio cuadrado con tiempos a favor.", isCorrect: true },
                { text: "Porque el peón h5 quedaba ahogado.", isCorrect: false },
                { text: "Porque el rey negro capturaba el peón de a inmediatamente.", isCorrect: false },
                { text: "Porque la regla de Studineski prohíbe mover los peones de h.", isCorrect: false }
            ]
        },
        {
            question: "8. En el estudio de Kling y Horwitz, ¿cómo logra el rey blanco detener a los dos peones negros aislados?",
            options: [
                { text: "Corriendo apresuradamente tras el peón más adelantado.", isCorrect: false },
                { text: "Manteniéndose equidistante a ambos peones para capturar el que avance o evitar que creen la posición de Studineski.", isCorrect: true },
                { text: "Bloqueando ambos peones con su rey en la primera fila.", isCorrect: false },
                { text: "Sacrificando todos sus peones para forzar tablas.", isCorrect: false }
            ]
        },
        {
            question: "9. En la partida Stolz vs. Nimzowitsch (autor de 'Mi Sistema'), ¿qué genialidad realiza Nimzowitsch con f4?",
            options: [
                { text: "Crea la amenaza de Studineski combinándola sutilmente con mantener a su rey dentro del cuadrado del peón rival.", isCorrect: true },
                { text: "Busca la coronación directa sacrificando a su rey.", isCorrect: false },
                { text: "Ofrece tablas por repetición de jugadas.", isCorrect: false },
                { text: "Bloquea el centro para impedir cualquier avance.", isCorrect: false }
            ]
        },
        {
            question: "10. ¿Qué expresión humorística se utiliza en el vídeo para describir cuando el bando defensor cae en zugzwang y se ve obligado a empeorar su posición?",
            options: [
                { text: "Caer en un 'Survarán' / Zugzwang.", isCorrect: true },
                { text: "Caer en la 'trampa de la red'.", isCorrect: false },
                { text: "Caer en el 'efecto dominó'.", isCorrect: false },
                { text: "Caer en la 'jaula de hierro'.", isCorrect: false }
            ]
        }
    ];

    let score = 0;
    let answeredQuestions = 0;

    // Función para construir el cuestionario
    function buildQuiz() {
        const quizContainer = document.getElementById('quiz');
        quizData.forEach((q, qIndex) => {
            const questionDiv = document.createElement('div');
            questionDiv.classList.add('question');
            questionDiv.innerHTML = `<p>${q.question}</p>`;
            
            const optionsDiv = document.createElement('div');
            optionsDiv.classList.add('options');
            
            q.options.forEach((opt, oIndex) => {
                const optionDiv = document.createElement('div');
                optionDiv.classList.add('option');
                optionDiv.innerText = opt.text;
                optionDiv.onclick = () => selectOption(optionDiv, opt.isCorrect, qIndex);
                optionsDiv.appendChild(optionDiv);
            });
            
            questionDiv.appendChild(optionsDiv);
            quizContainer.appendChild(questionDiv);
        });
    }

    // Selección de opción y corrección
    function selectOption(selectedDiv, isCorrect, qIndex) {
        const optionsDiv = selectedDiv.parentElement;
        const allOptions = optionsDiv.querySelectorAll('.option');
        
        if (optionsDiv.classList.contains('answered')) return;
        
        optionsDiv.classList.add('answered');
        answeredQuestions++;

        allOptions.forEach(opt => opt.classList.add('disabled'));

        if (isCorrect) {
            selectedDiv.classList.add('correct'); // Verde
            score++;
        } else {
            selectedDiv.classList.add('incorrect'); // Naranja
            // Mostrar la opción correcta en verde
            quizData[qIndex].options.forEach((opt, idx) => {
                if(opt.isCorrect) {
                    allOptions[idx].classList.add('correct');
                }
            });
        }
    }

    // Calcular y mostrar resultados con los mensajes por tramos
    function showResults() {
        if (answeredQuestions < quizData.length) {
            alert('Por favor, responde todas las preguntas pinchando en una opción antes de ver la puntuación final.');
            return;
        }

        const resultDiv = document.getElementById('result');
        resultDiv.style.display = 'block';
        
        let message = '';
        
        if (score < 5) {
            message = 'Necesitas mejorar. Lo ideal sería volver a ver el vídeo con tranquilidad e intentarlo de nuevo.';
            resultDiv.style.backgroundColor = '#f8d7da';
            resultDiv.style.color = '#721c24';
        } else if (score >= 5 && score <= 6) {
            message = '¡Bien! Has captado las ideas básicas, aunque te convendría repasar para afianzar conceptos.';
            resultDiv.style.backgroundColor = '#fff3cd';
            resultDiv.style.color = '#856404';
        } else if (score >= 7 && score <= 9) {
            message = '¡Bastante bien! Tienes un buen dominio de las reglas del cuadrado errante.';
            resultDiv.style.backgroundColor = '#cce5ff';
            resultDiv.style.color = '#004085';
        } else if (score === 10) {
            message = '¡Estupendo! Has estado pendiente del vídeo y has respondido todas las preguntas correctamente.';
            resultDiv.style.backgroundColor = '#d4edda';
            resultDiv.style.color = '#155724';
        }

        resultDiv.innerHTML = `<strong>Puntuación conseguida: ${score} de 10</strong><br><br>${message}`;
        document.getElementById('submit-btn').style.display = 'none';
    }

    // Inicialización al cargar la página
    buildQuiz();
</script>
</body>
</html>
